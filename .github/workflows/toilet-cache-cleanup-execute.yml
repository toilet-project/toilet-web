name: Incremental cache cleanup execute (disabled)

on:
  workflow_dispatch:
    inputs:
      expected_delete_files:
        description: Exact file count from the reviewed dry-run
        required: true
        type: string
      expected_delete_bytes:
        description: Exact byte count from the reviewed dry-run
        required: true
        type: string
      expected_delete_fingerprint:
        description: SHA-256 fingerprint from the reviewed dry-run
        required: true
        type: string
      confirmation:
        description: Type DELETE_RETIRED_INCREMENTAL_CACHE
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-incremental-cache-cleanup
  cancel-in-progress: false

jobs:
  execute:
    # Job-level conditions are evaluated before the Environment is attached.
    # Keep this non-secret gate as a repository variable.
    if: ${{ vars.CACHE_CLEANUP_EXECUTE_ENABLED == 'true' && inputs.confirmation == 'DELETE_RETIRED_INCREMENTAL_CACHE' }}
    environment: production-cache-maintenance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build reviewed release registry input
        shell: bash
        env:
          REGISTRY_JSON: ${{ vars.CACHE_RELEASE_REGISTRY_JSON }}
        run: |
          [[ -n "$REGISTRY_JSON" ]] || { echo "Release registry is required"; exit 1; }
          printf '%s' "$REGISTRY_JSON" > cache-release-registry.json
      - name: Delete only the reviewed retired cache plan
        env:
          CACHE_CLEANUP_ENABLED: 'true'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CACHE_STATUS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_CACHE_DELETE_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_CACHE_DELETE_SECRET_ACCESS_KEY }}
          R2_INCREMENTAL_CACHE_BUCKET: geupddong-next-production-cache
          EXPECTED_DELETE_FILES: ${{ inputs.expected_delete_files }}
          EXPECTED_DELETE_BYTES: ${{ inputs.expected_delete_bytes }}
          EXPECTED_DELETE_FINGERPRINT: ${{ inputs.expected_delete_fingerprint }}
        run: >-
          node scripts/cleanup-incremental-cache.mjs
          --registry cache-release-registry.json
          --report cache-cleanup-execution.json
          --execute
          --expected-delete-files "$EXPECTED_DELETE_FILES"
          --expected-delete-bytes "$EXPECTED_DELETE_BYTES"
          --expected-delete-fingerprint "$EXPECTED_DELETE_FINGERPRINT"
      - if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: incremental-cache-cleanup-execution
          path: cache-cleanup-execution.json
          retention-days: 14
          if-no-files-found: warn
