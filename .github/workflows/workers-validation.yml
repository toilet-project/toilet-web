name: Workers validation

on:
  push:
    branches: [feature/nextjs-toilet-seo]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workers-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: preview
            config: wrangler.jsonc
            indexable: 'false'
            review_api_enabled: 'false'
            review_production_approved: 'false'
            profile_photo_enabled: 'false'
            growth_enabled: 'false'
          - target: production-candidate
            config: wrangler.production.jsonc
            indexable: 'true'
            review_api_enabled: 'true'
            review_production_approved: 'true'
            profile_photo_enabled: 'true'
            growth_enabled: 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
      NEXT_PUBLIC_API_BASE_URL: https://api.geupddong.com
      NEXT_PUBLIC_KAKAO_JAVASCRIPT_KEY: ${{ secrets.NEXT_PUBLIC_KAKAO_JAVASCRIPT_KEY || 'build-validation-placeholder' }}
      SITE_INDEXABLE: ${{ matrix.indexable }}
      ENGLISH_UI_PREVIEW: ${{ matrix.target == 'preview' && 'true' || 'false' }}
      ENGLISH_UI_RELEASE: ${{ matrix.target == 'production-candidate' && 'true' || 'false' }}
      MAP_FILTERS_RELEASE: ${{ matrix.target == 'production-candidate' && 'true' || 'false' }}
      REVIEW_API_ENABLED: ${{ matrix.review_api_enabled }}
      REVIEW_PRODUCTION_APPROVED: ${{ matrix.review_production_approved }}
      TOILET_ENGAGEMENT_ENABLED: ${{ matrix.target == 'production-candidate' && 'true' || 'false' }}
      REPORT_REDESIGN_RELEASE: ${{ matrix.target == 'production-candidate' && 'true' || 'false' }}
      NEXT_PUBLIC_PROFILE_PHOTO_ENABLED: ${{ matrix.profile_photo_enabled }}
      NEXT_PUBLIC_GROWTH_ENABLED: ${{ matrix.growth_enabled }}
      NEXT_DEPLOYMENT_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run test:detail-production
      - run: node tests/detail-production-smoke.mjs --indexable
      - run: pnpm exec opennextjs-cloudflare build --config ${{ matrix.config }}
      - if: matrix.target == 'production-candidate'
        run: node scripts/verify-region-worker-cold.mjs
      - if: matrix.target == 'production-candidate'
        run: node scripts/verify-detail-fragment-worker.mjs
      - run: node scripts/relocate-worker-wasm.mjs
      - run: node scripts/write-worker-release-manifest.mjs ${{ matrix.target }}
      # Deliberately no Cloudflare credentials, upload, resource creation or deployment.
      - name: Validate Worker bundle without uploading
        run: pnpm exec wrangler deploy --dry-run --config ${{ matrix.config }}
      # Build on Linux; deploy manually using the approved local Cloudflare session.
      # No OAuth tokens or production secrets enter this artifact.
      - name: Package selected candidate runtime
        # Include ONLY the selected config: an indexable candidate must never
        # fall back to preview's default wrangler.jsonc when extracted.
        run: tar -czf workers-${{ matrix.target }}.tar.gz .open-next custom-worker.mjs worker-cache-policy.mjs region-markers-worker.ts src/lib/regionMarkerStore.ts src/lib/regionDisplayItems.ts src/i18n/toiletTranslations.ts data/regions/boundary-assets.json review-verification-proxy.mjs report-preview-proxy.mjs place-search-worker.mjs map-provider-worker.mjs package.json pnpm-lock.yaml pnpm-workspace.yaml ${{ matrix.config }} worker-release-manifest.json open-next.config.ts detail-incremental-cache.ts detail-cache-tags.ts next.config.ts .next/BUILD_ID
      - uses: actions/upload-artifact@v4
        with:
          name: workers-${{ matrix.target }}-${{ github.sha }}
          path: workers-${{ matrix.target }}.tar.gz
          retention-days: 3

  detail-cache-cross-release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: workers-preview-${{ github.sha }}
          path: .fragment-proof/preview
      - uses: actions/download-artifact@v4
        with:
          name: workers-production-candidate-${{ github.sha }}
          path: .fragment-proof/production
      - name: Extract the two independently compiled releases
        run: |
          tar -xzf .fragment-proof/preview/workers-preview.tar.gz -C .fragment-proof/preview
          tar -xzf .fragment-proof/production/workers-production-candidate.tar.gz -C .fragment-proof/production
      - name: Reuse body cache across releases without remote storage access
        run: node scripts/verify-detail-fragment-worker.mjs .fragment-proof/preview .fragment-proof/production
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detail-fragment-cross-release-${{ github.sha }}
          path: detail-fragment-worker-report.json
          if-no-files-found: ignore
          retention-days: 14
