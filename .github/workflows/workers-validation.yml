name: Workers validation

on:
  push:
    branches: [feature/nextjs-toilet-seo]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workers-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
      NEXT_PUBLIC_API_BASE_URL: https://api.geupddong.com
      NEXT_PUBLIC_KAKAO_JAVASCRIPT_KEY: build-validation-placeholder
      SITE_INDEXABLE: 'false'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run test:detail-production
      - run: node tests/detail-production-smoke.mjs --indexable
      - run: pnpm run build:workers
      # Deliberately no Cloudflare credentials, upload, resource creation or deployment.
      - name: Validate Worker bundle without uploading
        run: pnpm exec wrangler deploy --dry-run
