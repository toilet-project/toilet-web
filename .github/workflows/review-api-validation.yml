name: Review API integration candidate
on:
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
concurrency:
  group: review-api-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_API_BASE_URL: https://preview.geupddong.com/__review-verification
      NEXT_PUBLIC_KAKAO_JAVASCRIPT_KEY: ${{ secrets.NEXT_PUBLIC_KAKAO_JAVASCRIPT_KEY || 'build-validation-placeholder' }}
      NEXT_DEPLOYMENT_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-review-verification
      SITE_INDEXABLE: 'false'
      REVIEW_API_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm test
      # Synthetic-only API candidate. No production credentials, review writes or deployment.
      - run: pnpm exec opennextjs-cloudflare build --config wrangler.jsonc
      - run: node scripts/write-worker-release-manifest.mjs preview
      - run: pnpm exec wrangler deploy --dry-run --config wrangler.jsonc
      - run: tar -czf workers-review-verification.tar.gz .open-next custom-worker.mjs worker-cache-policy.mjs review-verification-proxy.mjs package.json pnpm-lock.yaml wrangler.jsonc worker-release-manifest.json open-next.config.ts next.config.ts .next/BUILD_ID
      - uses: actions/upload-artifact@v4
        with:
          name: workers-review-verification-${{ github.sha }}
          path: workers-review-verification.tar.gz
          retention-days: 1
  production-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_API_BASE_URL: https://api.geupddong.com
      NEXT_PUBLIC_KAKAO_JAVASCRIPT_KEY: ${{ secrets.NEXT_PUBLIC_KAKAO_JAVASCRIPT_KEY || 'build-validation-placeholder' }}
      NEXT_DEPLOYMENT_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-review-production-candidate
      SITE_INDEXABLE: 'true'
      REVIEW_API_ENABLED: 'true'
      REVIEW_PRODUCTION_APPROVED: 'true'
      # Candidate validation only; this workflow never deploys or activates the feature.
      NEXT_PUBLIC_PROFILE_PHOTO_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm exec opennextjs-cloudflare build --config wrangler.production.jsonc
      - run: node scripts/write-worker-release-manifest.mjs production-candidate
      - run: pnpm exec wrangler deploy --dry-run --config wrangler.production.jsonc
      - run: tar -czf workers-review-production-candidate.tar.gz .open-next custom-worker.mjs worker-cache-policy.mjs review-verification-proxy.mjs package.json pnpm-lock.yaml wrangler.production.jsonc worker-release-manifest.json open-next.config.ts next.config.ts .next/BUILD_ID
      - uses: actions/upload-artifact@v4
        with:
          name: workers-review-production-candidate-${{ github.sha }}
          path: workers-review-production-candidate.tar.gz
          retention-days: 3
