name: Review API integration candidate
on:
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
concurrency:
  group: review-api-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_API_BASE_URL: https://api.geupddong.com
      NEXT_PUBLIC_KAKAO_JAVASCRIPT_KEY: build-validation-placeholder
      SITE_INDEXABLE: 'false'
      REVIEW_API_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm test
      # Compile the opt-in branch too. No API credentials, review writes, uploads or deployment.
      - run: pnpm run build
